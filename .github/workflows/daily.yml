name: Daily IPTV Account

on:
  schedule:
    # كل يوم الساعة 8 صباحاً بتوقيت القاهرة (6 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # زر تشغيل يدوي

jobs:
  run-iptv:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable fonts-liberation libappindicator3-1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils --no-install-recommends
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install puppeteer-real-browser
    
    - name: Create base.m3u if not exists
      run: |
        if [ ! -f base.m3u ]; then
          echo "#EXTM3U" > base.m3u
          echo "#EXTINF:-1,Channel 1" >> base.m3u
          echo "http://example.com/get.php?username={USERNAME}&password={PASSWORD}&type=m3u_plus&output=ts" >> base.m3u
        fi
    
    - name: Run IPTV script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'
        DISPLAY: ':99.0'
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        sleep 3
        node index.js
    
    - name: Commit and push results
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || git commit -m "🤖 Auto update - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
